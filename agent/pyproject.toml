[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent"
version = "0.2.0"
description = "A minimal Flower AgentApp"
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = ["flwr>=1.35.0,<2.0", "openai>=2.16.0,<3.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.35.0"
fab-include = ["agent/**/*.py", "agent/**/*.json", "LICENSE"]

[tool.flwr.app.config.agent]
input = "Should I irrigate today?"
farm_id = "farmer_1"
field_id = ""

[tool.flwr.app.components]
agentapp = "agent.agent_app:app"
