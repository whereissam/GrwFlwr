[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "GrwFlwr"
version = "0.2.0"
description = "An agentic Flower app that advises farmers on watering decisions using live weather, a federated-learning model, and local farm data."
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = ["flwr>=1.35.0,<2.0", "openai>=2.16.0,<3.0.0", "tzdata>=2025.2"]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.flwr.app]
publisher = "julianp"
display-name = "GrwFlwr"
fab-format-version = 1
flwr-version-target = "1.35.0"
fab-include = ["agent/**/*.py", "agent/**/*.json", "LICENSE"]

[tool.flwr.app.config.agent]
input = "Should I water today?"
farm_id = "farm-001"
latitude = 52.52
longitude = 13.405
action = ""
schedule_hour = 16
timezone = "Europe/Berlin"

[tool.flwr.app.components]
agentapp = "agent.agent_app:app"
