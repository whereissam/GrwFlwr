[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "growflwr"
version = "0.1.0"
description = "Federated irrigation-safety model for GrowFlwr"
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = ["flwr[simulation]>=1.35.0,<2.0", "numpy>=1.26,<3.0"]

[tool.hatch.build.targets.wheel]
packages = ["growflwr"]

[tool.flwr.app]
publisher = "growflwr"
fab-format-version = 1
flwr-version-target = "1.35.0"
fab-include = ["growflwr/**/*.py", "growflwr/dataset/*", "LICENSE"]

[tool.flwr.app.components]
serverapp = "growflwr.server_app:app"
clientapp = "growflwr.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10
local-epochs = 40
learning-rate = 0.3


