[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grwflwr"
version = "0.1.0"
description = "Federated irrigation-safety model for GrwFlwr"
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = ["flwr[simulation]>=1.35.0,<2.0", "numpy>=1.26,<3.0"]

[tool.hatch.build.targets.wheel]
packages = ["grwflwr"]

[tool.flwr.app]
publisher = "grwflwr"
fab-format-version = 1
flwr-version-target = "1.35.0"
fab-include = ["grwflwr/**/*.py", "grwflwr/dataset/*", "LICENSE"]

[tool.flwr.app.components]
serverapp = "grwflwr.server_app:app"
clientapp = "grwflwr.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 30
local-epochs = 40
learning-rate = 0.3


#######################################################################
# CONFIGURATION MIGRATION NOTICE:
#
# What was previously called "federation config" for SuperLink
# connections in pyproject.toml has been renamed and moved.
#
# These settings are now **SuperLink connection configuration**
# and are defined in the Flower configuration file.
#
# The entries below are commented out intentionally and are kept
# only as a migration reference.
#
# Docs: https://flower.ai/docs/framework/ref-flower-configuration.html
#######################################################################

# [tool.flwr.federations]
# The federation block is deliberately absent. `flwr` migrates it into
# ~/.flwr/config.toml on first run and then ignores this file, so a value here
# silently goes stale. Pass it per-run instead:
#
#     uv run flwr run . local-sim --federation-config 'num-supernodes=2'
#
# It must equal the number of partitions in the dataset (currently 2). More
# SuperNodes than partitions does not fail the run -- the extra clients raise
# every round while FedAvg quietly completes on the rest.
